# /etc/nginx/sites-available/kiosk, as on the Pi
# (docs/architecture/raspberry-pi-infrastructure.md + scripts/fix-nginx-proxy.sh,
#  which removed the trailing slash from proxy_pass so /api/ is passed through).
server {
    listen 80 default_server;
    server_name _;
    root /var/www/kiosk/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
